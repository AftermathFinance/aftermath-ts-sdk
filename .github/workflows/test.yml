name: Test

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test SDK
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.8

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install
              run: bun install --frozen-lockfile

            - name: Test with coverage thresholds
              run: bun run test:ci

            - name: Test release guard
              run: bun run test:release

            - name: Typecheck tests
              run: bun run typecheck:tests

            - name: Audit test surface
              run: bun run test:surface:strict

            - name: Build SDK
              run: bun run build
