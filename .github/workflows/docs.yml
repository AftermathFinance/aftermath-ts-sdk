name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "src/**"
      - "scripts/auditDocumentation.mjs"
      - "scripts/checkDocumentationLinks.mjs"
      - "scripts/checkPackage.mjs"
      - "typedoc.json"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "src/**"
      - "scripts/auditDocumentation.mjs"
      - "scripts/checkDocumentationLinks.mjs"
      - "scripts/checkPackage.mjs"
      - "typedoc.json"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build SDK
        run: bun run build
      - name: Audit public documentation
        run: bun run docs:audit:strict
      - name: Generate TypeDoc
        run: bun run docs:generate
      - name: Check documentation links
        run: bun run docs:check-links
      - name: Check package contents
        run: bun run package:check
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
